[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# xunit1 soporta <properties> por <testcase>, necesario para volcar el
# tag @TC_<ID> de cada test y que el publicador lo mapee a su Test Case.
junit_family = xunit1
addopts =
    -ra
    --strict-markers
    --import-mode=importlib
    --html=playwright-report/report.html
    --self-contained-html
# Los tags @TC_<ID> no se listan aquí: conftest.py los registra al recolectar.
markers =
    smoke: pruebas críticas de validación rápida
    test_regresion: escenarios incluidos en la suite de regresión completa
    persistente: escenarios que persisten datos reales (requieren --persistir-cambios)
    revision: escenario marcado para revisar/ejecutar caso a caso (usar pytest -m revision)
    pipeline: escenarios ejecutados en el pipeline de CI/CD de Azure DevOps
    perfil_admin: el Background hace login con APP_ADMIN_USER / APP_ADMIN_PASSWORD
    sin_plan: escenario propio del framework que no se sincroniza con el plan de pruebas (.xlsx)
